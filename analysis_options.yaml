# This file is used by all dart projects in this monorepo.

include: package:lint/strict.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  riverpod_lint: ^3.1.9

# You can customize the lint rules set to your own liking. A list of all rules
# can be found at https://dart-lang.github.io/linter/lints/options/options.html
linter:
  rules:
    # Util classes are awesome!
    # avoid_classes_with_only_static_members: false

    # Make constructors the first thing in every class
    # sort_constructors_first: true

    # prefer_single_quotes: true

    # DISABLE
    # We have prints for better debugging. Maybe not the best option.
    avoid_print: false
    # Automatically sort pub dependencies
    sort_pub_dependencies: true

    # DISABLE until the Dart 3.13 constructor migration is complete.
    empty_container_bodies: false
    unnecessary_const_in_enum_constructor: false
    unnecessary_type_name_in_constructor: false
    use_primary_constructors: false
    prefer_initializing_formals: false
