# SonarQube project configuration for the StudyU monorepo.
# Verified against SonarQube Community Build 26.5.0.122743. Successful CI scans
# log the Flutter analyzer sensors and the mc1arke community branch plugin
# pull request scanner sensor.

sonar.projectKey=studyu-health_studyu
sonar.projectName=StudyU

# Analyze the Dart/Flutter library and test code for the workspace packages.
sonar.sources=app/lib,core/lib,designer_v2/lib,flutter_common/lib
sonar.tests=app/test,core/test,designer_v2/test,flutter_common/test

# Exclude generated code and generated localization files from analysis.
sonar.exclusions=**/*.g.dart,**/app/lib/l10n/app_localizations*.dart,**/designer_v2/lib/localization/app_localizations*.dart

# Coverage report produced by the CI workflow. This is the only coverage input;
# the test execution reports below do not calculate coverage.
sonar.flutter.coverage.reportPath=coverage/sonar/lcov.info

# UI and platform adapters are verified by browser or widget tests rather than
# the VM coverage pass used by the Sonar analysis.
sonar.coverage.exclusions=app/lib/widgets/questionnaire/question_container.dart,designer_v2/lib/features/account/study_import.dart,designer_v2/lib/features/account/study_import_stub.dart,designer_v2/lib/features/account/study_import_web.dart,designer_v2/lib/features/analyze/study_export_zip.dart,designer_v2/lib/features/design/enrollment/screener_question_form_controller.dart,designer_v2/lib/features/design/shared/questionnaire/question/question_conditional_form_view.dart,designer_v2/lib/features/design/shared/questionnaire/question/question_form_controller.dart,designer_v2/lib/features/design/shared/questionnaire/question/question_form_view.dart,designer_v2/lib/features/design/shared/questionnaire/question/types/medication_question_form_view.dart

# Unit test execution reports produced by the CI workflow. The Flutter sensor
# accepts a comma-separated list and does not support wildcards.
sonar.flutter.tests.reportPath=app/coverage/tests.output,core/coverage/tests.output,designer_v2/coverage/tests.output,flutter_common/coverage/tests.output

# Exclude generated Mockito mocks from test analysis. sonar.exclusions applies
# to source code only, so test-scope exclusions need this separate property.
sonar.test.exclusions=**/*.mocks.dart

# Dart analyzer report produced by the CI workflow.
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.mode=MACHINE
sonar.dart.analyzer.report.path=coverage/sonar/dart-analyze.txt

# Wait for the SonarQube quality gate and fail the workflow when it does not pass.
sonar.qualitygate.wait=true
