name: SonarQube

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

env:
  MELOS_SDK_PATH: auto

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is unavailable." >&2
            exit 1
          fi
          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error::SONAR_HOST_URL is not configured." >&2
            exit 1
          fi

      - name: Init workspace
        uses: ./.github/workflows/init-workspace

      - name: Verify coverage normalizer
        run: dart scripts/normalize_lcov.dart --check

      - name: Run tests with coverage
        run: melos run test:coverage --no-select

      - name: Validate Flutter test reports
        shell: bash
        run: |
          set -euo pipefail
          reports=(
            app/coverage/tests.output
            core/coverage/tests.output
            designer_v2/coverage/tests.output
            flutter_common/coverage/tests.output
          )
          for report in "${reports[@]}"; do
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing or empty Flutter test report: $report" >&2
              exit 1
            fi
            if ! jq -s -e \
              'length > 0 and any(.[]; .type == "suite") and (.[-1].type == "done" and .[-1].success == true)' \
              "$report" >/dev/null; then
              echo "::error::Invalid or unsuccessful Flutter test report: $report" >&2
              exit 1
            fi
          done

      - name: Validate and normalize coverage
        run: dart scripts/normalize_lcov.dart coverage/sonar/lcov.info

      - name: Generate Dart analyzer report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage/sonar
          dart analyze --no-fatal-warnings --format=machine \
            > coverage/sonar/dart-analyze.txt

      - name: Scan project for pull request
        id: scan_pr
        if: github.event_name == 'pull_request'
        uses: "SonarSource/sonarqube-scan-action@\
          c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2" # v7
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Scan project
        id: scan_push
        if: github.event_name != 'pull_request'
        uses: "SonarSource/sonarqube-scan-action@\
          c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2" # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # The scan action fails when the quality gate does not pass, but it does
      # not report which condition failed. This step publishes that result to
      # the check run and the job summary.
      - name: Report quality gate failure
        if: >-
          failure() &&
          (steps.scan_pr.outcome == 'failure' ||
            steps.scan_push.outcome == 'failure')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          project=hpi-studyu_studyu
          host="${SONAR_HOST_URL%/}"
          scope="branch=dev"
          target="branch dev"
          task_mode=main
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            scope="pullRequest=${PR_NUMBER}"
            target="pull request #${PR_NUMBER}"
            task_mode=pull_request
          fi
          dashboard="${host}/dashboard?id=${project}&${scope}"

          gate=$(curl -sS -u "${SONAR_TOKEN}:" \
            "${host}/api/qualitygates/project_status?projectKey=${project}&${scope}" || true)
          status=$(jq -r '.projectStatus.status // empty' <<<"${gate}" 2>/dev/null || true)

          if [[ -z "${status}" ]]; then
            echo "SonarQube returned no quality gate result for ${target}." >&2
            echo "The analysis did not reach an accepted state." >&2
          else
            {
              echo "### SonarQube quality gate: ${status}"
              echo
              echo "| Condition | Status | Value | Threshold |"
              echo "| --- | --- | --- | --- |"
              jq -r '.projectStatus.conditions[]
                | "| `\(.metricKey)` | \(.status) | \(.actualValue) | \(.errorThreshold) |"' <<<"${gate}"
              echo
              echo "[Open the analysis in SonarQube](${dashboard})"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            jq -r --arg target "${target}" --arg dashboard "${dashboard}" '
              .projectStatus.conditions[]
              | select(.status == "ERROR")
              | "::error title=SonarQube quality gate::\(.metricKey) is \(.actualValue) on \($target), \(
                  if .comparator == "LT" then "below"
                  elif .comparator == "GT" then "above"
                  else "at"
                  end) the \(.errorThreshold) threshold. \($dashboard)"
            ' <<<"${gate}"
          fi

          analysis=$(curl -sS -u "${SONAR_TOKEN}:" \
            "${host}/api/ce/activity?component=${project}&ps=10" || true)
          task=$(jq -c --arg pr "${PR_NUMBER}" --arg mode "${task_mode}" '
            [.tasks[]
              | select(if $mode == "pull_request"
                  then (.pullRequest == $pr)
                  else (.pullRequest == null)
                  end)]
            | first // {}' <<<"${analysis}" 2>/dev/null || echo '{}')
          case "$(jq -r '.status // "unknown"' <<<"${task}")" in
            FAILED)
              jq -r '.errorMessage // "SonarQube reported no error message."' \
                <<<"${task}" | tr '\n' ' ' \
                | sed 's/^/::error title=SonarQube analysis failed::/'
              ;;
            SUCCESS)
              if [[ "${status:-}" == "ERROR" ]]; then
                echo "The latest SonarQube analysis task succeeded, so the quality gate rejected the analysis."
              else
                echo "The latest SonarQube analysis task succeeded, so the scan action failed for another reason. Inspect the scan step log."
              fi
              ;;
            *)
              echo "The latest SonarQube analysis task status is unknown."
              ;;
          esac
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
