name: Ready to Merge
on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  checks: read

concurrency:
  group: ${{ github.ref }}-ready-to-merge
  cancel-in-progress: true

jobs:
  ready_to_merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is ready to merge
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha =
              context.payload.pull_request?.head?.sha ?? context.sha;
            const startupRetries = 15;
            const completionRetries = 15;
            const startupDelay = 10000;
            const completionDelay = 60000;

            // Push workflows run for every branch. Path-filtered workflows
            // are optional.
            const workflowsToCheck = [
              { id: "linter.yml", required: true },
              { id: "mega-linter.yml", required: true },
              { id: "all_packages.yml", required: false },
              { id: "e2e_tests.yml", required: false },
              { id: "supabase-test.yml", required: false },
            ];
            // dart_file_lines.yml is dispatch-only, so it is not a merge gate.

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            async function findNewestRun(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: commitSha,
                per_page: 100,
              });
              return response.data.workflow_runs
                .filter((run) => run.head_sha === commitSha)
                .sort((a, b) => {
                  const first = Date.parse(a.created_at);
                  const second = Date.parse(b.created_at);
                  return second - first;
                })[0];
            }

            async function waitForRun(workflow) {
              for (let attempt = 0; attempt <= startupRetries; attempt += 1) {
                let run;
                try {
                  run = await findNewestRun(workflow.id);
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
                if (run) {
                  console.log(
                    `Found ${workflow.id} run ${run.id} for ${commitSha}.`
                  );
                  return run;
                }
                if (attempt < startupRetries) {
                  console.log(
                    `Waiting for ${workflow.id} to start ` +
                    `(${attempt + 1}/${startupRetries})...`
                  );
                  await sleep(startupDelay);
                }
              }
              return undefined;
            }

            async function failedChecks(run) {
              if (!run.check_suite_id) {
                return [];
              }
              try {
                const response = await github.rest.checks.listForSuite({
                  owner,
                  repo,
                  check_suite_id: run.check_suite_id,
                  per_page: 100,
                });
                return response.data.check_runs
                  .filter((checkRun) => checkRun.conclusion !== "success")
                  .map((checkRun) => {
                    const url = checkRun.html_url
                      ? ` (${checkRun.html_url})`
                      : "";
                    return `${checkRun.name}${url}`;
                  });
              } catch (error) {
                console.warn(
                  `Could not list checks for run ${run.id}: ${error.message}`
                );
                return [];
              }
            }

            async function waitForCompletion(run) {
              for (
                let attempt = 0;
                attempt <= completionRetries;
                attempt += 1
              ) {
                const current = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                const workflowRun = current.data;
                console.log(
                  `${workflowRun.name} run ${workflowRun.id}: ` +
                  `${workflowRun.status}/${workflowRun.conclusion}`
                );
                if (workflowRun.status === "completed") {
                  if (workflowRun.conclusion === "success") {
                    return;
                  }
                  const checks = await failedChecks(workflowRun);
                  const checkSummary = checks.length
                    ? ` Failed checks: ${checks.join(", ")}.`
                    : "";
                  throw new Error(
                    `${workflowRun.name} finished with ` +
                    `conclusion '${workflowRun.conclusion}'. ` +
                    `Run URL: ${workflowRun.html_url}.${checkSummary}`
                  );
                }
                if (attempt === completionRetries) {
                  throw new Error(
                    `${workflowRun.name} run ${workflowRun.id} did not ` +
                    "finish " +
                    `within the polling limit. Run URL: ${workflowRun.html_url}`
                  );
                }
                await sleep(completionDelay);
              }
            }

            const failures = [];
            console.log(`Checking workflows for immutable SHA ${commitSha}.`);
            for (const workflow of workflowsToCheck) {
              const run = await waitForRun(workflow);
              if (!run) {
                if (workflow.required) {
                  failures.push(
                    `${workflow.id} did not start for ${commitSha} ` +
                    `within the startup limit.`
                  );
                } else {
                  console.log(
                    `Skipping optional path-filtered workflow ${workflow.id};` +
                    "no run was found."
                  );
                }
                continue;
              }
              try {
                await waitForCompletion(run);
              } catch (error) {
                failures.push(error.message);
              }
            }

            if (failures.length) {
              core.setFailed(failures.join("\n"));
            } else {
              console.log("All required workflow runs succeeded.");
            }
