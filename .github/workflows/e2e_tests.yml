name: E2E tests

on:
  push:
    paths:
      - ".github/workflows/e2e_tests.yml"
      - ".github/workflows/init-workspace/action.yml"
      - "supabase/**"
      - "scripts/reset-test-db.sh"
      - "designer_v2/**"
      - "app/**"
      - "core/**"
      - "flutter_common/**"
  workflow_dispatch:

env:
  MELOS_SDK_PATH: "auto"

jobs:
  drive_web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init workspace
        uses: ./.github/workflows/init-workspace

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Enable web support
        run: flutter config --enable-web

      - name: Prepare environment
        run: |
          dart pub get
          dart pub global activate melos
          melos bootstrap

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start -x studio,imgproxy

      - name: Reset Supabase database
        run: ./scripts/reset-test-db.sh --yes

      - name: Configure local StudyU environment
        run: |
          cp flutter_common/lib/envs/.env.local.example \
            flutter_common/lib/envs/.env.local
          LC_ALL=C sed -i.bak \
            '/STUDYU_SUPABASE_PUBLIC_ANON_KEY/d' \
            flutter_common/lib/envs/.env.local
          supabase_anon_key="$(supabase status -o env | grep ANON_KEY \
            | cut -d'=' -f2)"
          echo "STUDYU_SUPABASE_PUBLIC_ANON_KEY=$supabase_anon_key" \
            >> flutter_common/lib/envs/.env.local

      - name: Start Chrome Driver
        run: |
          export DISPLAY=:99
          chromedriver --port=4444 &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Run Designer Flutter E2E tests
        working-directory: ./designer_v2
        run: |
          flutter drive --driver=test_driver/integration_driver.dart \
            --target=integration_test/app_test.dart -d web-server \
            --dart-define="STUDYU_ENV=.env.local"

      - name: Run app E2E tests
        working-directory: ./app
        run: |
          # Run every app integration test target, one isolated
          # Flutter-drive/ChromeDriver browser session each, so targets never
          # share browser/app state. Successful recovery persists credentials
          # and an active subject.
          #
          # Ordering note: recovery_e2e_active_test.dart must run before
          # recovery_e2e_reused_phrase_test.dart, because the reused-phrase
          # target asserts that the active target already consumed (rotated)
          # its fixed fixture recovery ID. Alphabetical glob order satisfies
          # this (active < confirmation < no_study < reused_phrase).
          e2e_email="recovery-signed-in@local.studyu.test"
          e2e_password="recovery-signed-in-pass"
          for target in integration_test/*_test.dart; do
            defines=("--dart-define=STUDYU_ENV=.env.local")
            case "$target" in
              *recovery_e2e_confirmation_test.dart)
                # Only the signed-in journey bootstraps a participant session.
                defines+=(
                  "--dart-define=STUDYU_E2E_PARTICIPANT_EMAIL=$e2e_email"
                  "--dart-define=STUDYU_E2E_PARTICIPANT_PASSWORD=$e2e_password"
                )
                ;;
            esac
            flutter drive --driver=test_driver/integration_driver.dart \
              --target="$target" -d web-server "${defines[@]}"
          done
