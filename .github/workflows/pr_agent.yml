name: PR Agent

# Repository-aware PR review bot (https://docs.pr-agent.ai).
# Configuration and repository conventions are read from the default branch.
#
# Uses pull_request_target so PRs from forks can be reviewed. This is safe
# here because PR-Agent works against the GitHub API and we intentionally do
# NOT add actions/checkout (see the security note in the PR-Agent docs), so
# no PR code ever executes in this workflow.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  issue_comment:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          (github.event_name == 'pull_request_target' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    name: Run PR Agent on pull requests and respond to comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model is served through OpenRouter; the key is a secret and the
          # model name is a repository variable (e.g. "openrouter/anthropic/claude-sonnet-4").
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: ${{ vars.OPENROUTER_MODEL }}
          config.fallback_models: '["${{ vars.OPENROUTER_MODEL }}"]'
          config.custom_model_max_tokens: "1050000"
          jira.jira_api_email: ${{ secrets.JIRA_API_EMAIL }}
          jira.jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
