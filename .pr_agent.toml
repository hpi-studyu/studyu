# StudyU PR-Agent configuration.
# See https://docs.pr-agent.ai/usage-guide/configuration_options/

[config]
# AGENTS.md contains the repository conventions used by PR-Agent.
repo_context_files = ["AGENTS.md"]
repo_context_max_lines = 500

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = false
pr_actions = ["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]

[ignore]
glob = [
    "*.g.dart",
    "*.freezed.dart",
    "*.gr.dart",
    "*.gen.dart",
    "*.lock",
    "*/gen_l10n/*",
    "*/l10n/*.dart",
    "*/.dart_tool/*",
    "*/build/*",
    "*/ios/Pods/*",
    "*/android/.gradle/*",
    ".agents/skills/studyu-material3/.build/*",
]

[pr_reviewer]
num_max_findings = 6
require_tests_review = true
require_score_review = true
require_security_review = true
require_can_be_split_review = true
require_estimate_effort_to_review = true
require_todo_scan = true
require_ticket_analysis_review = true
check_pr_additional_content = true
extra_instructions = """
Act as a senior engineer reviewing a production Flutter/Dart monorepo. Review the
complete diff in repository context, not only the changed lines. Inspect callers,
dependents, persistence boundaries, generated sources, tests, and relevant platform
or CI integration before reporting a finding.

Review for the following, when relevant to the changed paths:

- User-facing regressions: crashes, broken navigation, lost input, incorrect state,
  broken loading or error states, accessibility or localization regressions, and
  behavior that differs across mobile, web, or platform lifecycle states.
- Edge cases: empty, null, malformed, duplicate, stale, repeated, out-of-order,
  offline, timeout, retry, permission, authentication, disposal, and partial-failure
  cases. For synchronization or integrations, check idempotency and recovery.
- Data safety: privacy, secrets, participant data, migration ordering, rollback risk,
  RLS, authorization, destructive cascades, and compatibility with existing studies.
- Tests: whether changed behavior and important edge cases are covered by the most
  appropriate existing test layer. Do not request tests only to increase coverage.
- YAGNI and simplicity: check whether new abstractions, flags, configurability,
  indirection, generalization, or defensive paths are required by the current request
  and repository architecture. Flag over-engineering only when it creates concrete
  complexity, maintenance cost, or risk and a simpler safe alternative is clear.
  Do not reject required architecture, boundary validation, or failure handling merely
  because it adds code. Do not demand compressed or one-line solutions.
- Scope: identify unrelated refactors, speculative features, dependency changes, or
  formatting churn that increase risk without serving the stated change.

Follow the repository review output and Conventional Comments rules in AGENTS.md.

Apply these repository-aware checks when the changed paths or behavior make them relevant:

- For annotated model changes in `core/`, verify that committed generated serialization files were regenerated with `fvm exec melos generate`. Comment on the source model, not generated files.
- For user-facing text, verify that strings use the package localization system instead of being hardcoded.
- For `supabase/` or `database/` changes, review row-level security, migration ordering, rollback implications, and compatibility with participants whose studies are already in progress.
- Scrutinize Fitbit and health integrations, notification scheduling, and offline-first synchronization for error handling, retries, idempotency, and partial-failure behavior.
- Verify that credentials, keys, and environment values are not committed. Environment templates belong in `flutter_common/lib/envs/`.
- Check that tests cover changed behavior and important edge cases. Do not request tests solely to increase coverage when existing tests already exercise the behavior.
- When a Jira ticket or GitHub issue is linked, compare the implementation with its requirements and acceptance criteria. Identify unrelated changes and requirements that the PR does not satisfy.
- Check that the PR title follows `<type>[(<scope>)]: <description>`. Allowed types are `feat`, `fix`, `chore`, `docs`, `refactor`, `test`, `style`, `perf`, `ci`, `build`, and `revert`. Allowed scopes are `app`, `designer`, `core`, `flutter_common`, and `db`. The description must be lowercase and must not end with a period.
- If a non-generated diff exceeds approximately 500 changed lines or contains independent themes, propose an independently mergeable split.
- Prioritize behavioral regressions, security, data integrity, compatibility, and missing tests. Avoid comments that only restate the diff or enforce preferences unsupported by repository conventions.
- Do not comment on generated files when the actionable change belongs in the source model, annotation, ARB file, or generator input.
- End the review with a concise summary of verified findings, checks considered, and residual verification gaps. Do not claim that a check passed unless the available evidence supports it.
"""

[pr_description]
use_description_markers = true

[jira]
jira_base_url = "https://studyu.atlassian.net"
