name: studyu
description: The root of the StudyU project
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
workspace:
  - core
  - flutter_common
  - app
  - designer_v2
dev_dependencies:
  melos: ^8.7.0

melos:
  repository: https://github.com/hpi-studyu/studyu
  sdkPath: .fvm/flutter_sdk
  scripts:
    setup:
      run: git config core.hooksPath .githooks
      description: >-
        Configure git to use the project's tracked hooks in .githooks/

    fix:
      run: |
        dart run melos exec -c 6 -- \
          "dart fix --apply"
      description: Fix auto-fixable lint errors

    outdated:
      run: |
        dart run melos exec -c 6 --fail-fast -- \
          "dart pub outdated"
      description: Check workspace packages for outdated dependencies

    upgrade:
      run: |
        dart pub upgrade
        dart run melos exec -c 6 --fail-fast -- \
          "dart pub upgrade" && dart run melos bootstrap
      description: >-
        Upgrade root and workspace dependencies, then bootstrap the workspace

    # Warning: This will also upgrade to dev versions.
    #upgrade:major:
    #  run: |
    #    dart pub upgrade --major-versions
    #    dart run melos exec -c 6 --fail-fast -- \
    #      "dart pub upgrade --major-versions" && dart run melos bootstrap
    #  description: Upgrade all dependencies to their latest major versions

    test:
      run: |
        rtk_prefix=""
        if [ "${CI:-}" != "true" ] && command -v rtk >/dev/null 2>&1; then
          rtk_prefix="rtk "
        fi
        dart run melos exec -c 6 --fail-fast -- \
          "${rtk_prefix}flutter test"
      description: >-
        Run `flutter test` for workspace packages that contain a test directory
      packageFilters:
        dirExists: test

    test:coverage:
      run: |
        rtk_prefix=""
        if [ "${CI:-}" != "true" ] && command -v rtk >/dev/null 2>&1; then
          rtk_prefix="rtk "
        fi
        dart run melos exec -c 6 --fail-fast -- \
          "${rtk_prefix}flutter test --coverage"
      description: >-
        Run `flutter test --coverage` per package with a test directory
      packageFilters:
        dirExists: test

    generate:
      run: |
        rtk_prefix=""
        if [ "${CI:-}" != "true" ] && command -v rtk >/dev/null 2>&1; then
          rtk_prefix="rtk "
        fi
        dart run melos exec -c 1 --fail-fast \
          --scope studyu_core --scope studyu_designer_v2 -- \
          "${rtk_prefix}dart run build_runner build"
      description: Generate files with build_runner

    qualitycheck:
      run: |
        set -e
        rtk_prefix=""
        if [ "${CI:-}" != "true" ] && command -v rtk >/dev/null 2>&1; then
          rtk_prefix="rtk "
        fi
        if [ "$CI" = "true" ]; then
          dart_cmd="dart"
          flutter_cmd="flutter"
        else
          dart_cmd="fvm dart"
          flutter_cmd="fvm flutter"
        fi
        ${rtk_prefix}${dart_cmd} format \
          --output=none --set-exit-if-changed .
        ${rtk_prefix}${dart_cmd} analyze
        ${rtk_prefix}${flutter_cmd} analyze
      description: Run read-only format and analysis checks

    reset:
      run: |
        git clean -x -d -f -q || true
        dart run melos clean
        dart run melos exec --flutter --concurrency=1 -- "flutter clean"
        dart run melos bootstrap
      description: Reset the workspace to a pristine checkout status.

    app:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8080"
      packageFilters:
        scope: studyu_app
      description: Runs StudyU App with default environment

    designer_v2:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8081"
      packageFilters:
        scope: studyu_designer_v2
      description: Runs StudyU Designer with default environment

    dev:app:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8080 \
           --dart-define=STUDYU_ENV=.env.dev"
      packageFilters:
        scope: studyu_app
      description: Runs StudyU App with the development environment

    dev:designer_v2:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8081 \
           --dart-define=STUDYU_ENV=.env.dev"
      packageFilters:
        scope: studyu_designer_v2
      description: Runs StudyU Designer with the development environment

    local:app:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8080 \
           --dart-define=STUDYU_ENV=.env.local"
      packageFilters:
        scope: studyu_app
      description: Runs StudyU App with local environment

    local:designer_v2:
      run: |
        dart run melos exec -c 1 -- \
          "flutter run -d chrome --web-port 8081 \
           --dart-define=STUDYU_ENV=.env.local \
           --dart-define=EMAIL=user1@studyu.health \
           --dart-define=PASSWORD=user1pass \
           --dart-define=AUTO_LOGIN=false"
      packageFilters:
        scope: studyu_designer_v2
      description: Runs StudyU Designer with local environment

    build:android:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build apk"
      description: Build app for Android.
      packageFilters:
        dirExists: android

    build:ios:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build ipa --no-codesign"
      description: Build app for iOS.
      packageFilters:
        dirExists: ios

    build:web:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build web"
      description: Build app for Web.
      packageFilters:
        scope: [studyu_app, studyu_designer_v2]
        dirExists: web

    build:web:app:
      run: |
        dart run melos exec -c 1 --fail-fast -- \
          "flutter build web"
      description: Build app for Web.
      packageFilters:
        scope: studyu_app

    build:web:designer_v2:
      run: |
        dart run melos exec -c 1 --fail-fast -- \
          "flutter build web"
      description: Build designer_v2 for Web.
      packageFilters:
        scope: studyu_designer_v2

    build:web:dev:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build web --dart-define=STUDYU_ENV=.env.dev"
      description: Build web dev.
      packageFilters:
        scope: [studyu_app, studyu_designer_v2]
        dirExists: web

    build:web:app:dev:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build web --dart-define=STUDYU_ENV=.env.dev"
      description: Build web app dev.
      packageFilters:
        scope: studyu_app
        dirExists: web

    build:web:designer_v2:dev:
      run: |
        dart run melos exec -c 2 --fail-fast -- \
          "flutter build web --dart-define=STUDYU_ENV=.env.dev"
      description: Build web designer_v2 dev.
      packageFilters:
        scope: studyu_designer_v2
        dirExists: web
